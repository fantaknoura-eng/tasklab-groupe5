<!doctype html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TaskLab TWIN2</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #24352f;
            --muted: #60716a;
            --paper: #f3f5ef;
            --surface: #fff;
            --line: #dce4dc;
            --green: #176b57;
            --green-dark: #124d42;
            --coral: #bd5638
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background-color: var(--paper);
            color: var(--ink);
            font-family: "Trebuchet MS", Verdana, sans-serif;
            line-height: 1.55
        }

        nav {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 16px max(24px, calc((100% - 920px)/2));
            background: var(--green-dark)
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 700
        }

        nav a:first-child {
            font-size: 1.25rem;
            letter-spacing: .04em;
            margin-right: auto
        }

        nav a:hover {
            text-decoration: underline;
            text-underline-offset: 4px
        }

        main {
            max-width: 920px;
            margin: 40px auto;
            padding: 0 24px
        }

        h1 {
            margin: 0 0 24px;
            font-size: 2rem;
            line-height: 1.2;
            color: var(--green-dark)
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 24px 0
        }

        li {
            margin: 14px 0;
            padding: 18px 20px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-left: 4px solid var(--green);
            border-radius: 4px
        }

        li strong {
            font-size: 1.08rem
        }

        li p {
            margin: 8px 0;
            color: var(--muted);
            overflow-wrap: anywhere
        }

        a {
            color: var(--green);
            font-weight: 700
        }

        form {
            margin: 18px 0
        }

        form p {
            margin: 0 0 16px
        }

        label {
            display: block;
            font-weight: 700
        }

        input,
        textarea,
        select {
            max-width: 100%;
            padding: 10px 12px;
            border: 1px solid #aebdb3;
            border-radius: 4px;
            background: var(--surface);
            color: var(--ink);
            font: inherit
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 3px solid #a9d8c8;
            outline-offset: 1px;
            border-color: var(--green)
        }

        textarea {
            width: 100%;
            resize: vertical
        }

        button {
            padding: 10px 16px;
            border: 0;
            border-radius: 4px;
            background: var(--green);
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer
        }

        button:hover {
            background: var(--green-dark)
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid var(--coral);
            outline-offset: 3px
        }

        @media(max-width:600px) {
            nav {
                gap: 16px;
                padding: 14px 18px
            }

            nav a:first-child {
                font-size: 1.1rem
            }

            main {
                margin: 28px auto;
                padding: 0 18px
            }

            h1 {
                font-size: 1.7rem
            }

            li {
                padding: 15px
            }
        }
    </style>
</head>

<body>
    <nav><a href="{% url 'liste_taches' %}">TaskLab</a><a href="{% url 'creer_tache' %}">Ajouter une tâche</a></nav>
    <main>{% block contenu %}{% endblock %}</main>
</body>

</html>
